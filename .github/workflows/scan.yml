name: Scansione bandi v5.1 - 4 Regioni

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * *"
    - cron: "15 12 * * 1-5"

concurrency:
  group: radar-appalti-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Verifica sintassi
        run: python -m py_compile scripts/scan.py

      - name: Scansione parallela
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: python -u scripts/scan.py

      - name: Pubblica risultati
        run: |
          git config user.name "Radar Appalti Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/gare.json data/gare.csv
          git diff --cached --quiet || git commit -m "Aggiornamento automatico Radar Appalti v5.1"
          git push
