name: Scansione bandi

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * *"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Scansiona le fonti
        run: python scripts/scan.py

      - name: Salva i nuovi risultati
        run: |
          git config user.name "Radar Appalti Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/gare.json
          git diff --cached --quiet || git commit -m "Aggiornamento automatico bandi"
          git push
